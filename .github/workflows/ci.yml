name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-self-test:
    name: Windows build and self-test
    runs-on: windows-latest
    timeout-minutes: 15

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Scan for committed secrets
        shell: pwsh
        run: .\scripts\scan-secrets.ps1

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore .\SshKeyDeployer.sln --nologo

      - name: Build solution
        shell: pwsh
        run: .\build.ps1 -Configuration Release -SkipRestore

      - name: Run console self-tests
        shell: pwsh
        run: dotnet run --project .\tests\SshKeyDeployer.SelfTest\SshKeyDeployer.SelfTest.csproj --configuration Release --no-build --no-restore
