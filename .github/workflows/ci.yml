name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-self-test:
    name: Windows build and self-test
    runs-on: windows-latest
    timeout-minutes: 25

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Scan for committed secrets
        shell: pwsh
        run: .\scripts\scan-secrets.ps1

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore .\SshKeyDeployer.sln --nologo

      - name: Build solution
        shell: pwsh
        run: .\build.ps1 -Configuration Release -SkipRestore

      - name: Run console self-tests
        shell: pwsh
        run: dotnet run --project .\tests\SshKeyDeployer.SelfTest\SshKeyDeployer.SelfTest.csproj --configuration Release --no-build --no-restore

      - name: Package Windows x64 release
        shell: pwsh
        run: |
          $version = ([xml](Get-Content .\Directory.Build.props)).Project.PropertyGroup.VersionPrefix
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'VersionPrefix not found.' }
          .\release.ps1 -Version $version

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release-assets
          path: |
            artifacts/SSH-Key-Deployer-v*-win-x64.zip
            artifacts/SSH-Key-Deployer-v*-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 7

  macos-arm64-package:
    name: macOS Apple Silicon package
    runs-on: macos-15
    timeout-minutes: 20

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build and package macOS Apple Silicon app
        shell: bash
        run: |
          version="$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props)"
          test -n "$version"
          ./scripts/package-macos.sh "$version"

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-release-assets
          path: |
            artifacts/SSH-Key-Deployer-v*-osx-arm64.zip
            artifacts/SSH-Key-Deployer-v*-osx-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 7

  macos-native-package:
    name: Native macOS (SwiftUI) universal package
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Test, build and package the SwiftUI app
        shell: bash
        run: ./macos-native/package.sh

      - name: Upload native macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: macos-native-universal-release-assets
          path: |
            artifacts/SSH-Key-Deployer-v*-macos-universal.zip
            artifacts/SSH-Key-Deployer-v*-macos-universal.zip.sha256
          if-no-files-found: error
          retention-days: 7

  linux-e2e:
    name: Linux E2E (distro matrix)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: debian-12, base: 'debian:12', sudo: '1' }
          - { distro: debian-12-nosudo, base: 'debian:12', sudo: '0' }
          - { distro: debian-13, base: 'debian:13', sudo: '1' }
          - { distro: ubuntu-22.04, base: 'ubuntu:22.04', sudo: '1' }
          - { distro: ubuntu-24.04, base: 'ubuntu:24.04', sudo: '1' }
          - { distro: almalinux-9, base: 'almalinux:9', sudo: '1' }
          - { distro: fedora, base: 'fedora:latest', sudo: '1' }
          - { distro: opensuse-leap-15.6, base: 'opensuse/leap:15.6', sudo: '1' }
          - { distro: archlinux, base: 'archlinux:latest', sudo: '1' }
          - { distro: alpine, base: 'alpine:latest', sudo: '1' }

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build deployer-e2e (Swift on Linux)
        shell: bash
        working-directory: macos-native
        run: |
          swift --version
          swift build --product deployer-e2e
          echo "DEPLOYER_CMD=$(swift build --show-bin-path)/deployer-e2e" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.distro }} SSH server image
        uses: docker/build-push-action@v6
        with:
          context: macos-native/e2e/image
          build-args: |
            BASE=${{ matrix.base }}
            WITH_SUDO=${{ matrix.sudo }}
          tags: sshkd-e2e:${{ matrix.distro }}
          load: true
          cache-from: type=gha,scope=e2e-${{ matrix.distro }}
          cache-to: type=gha,mode=max,scope=e2e-${{ matrix.distro }}

      - name: Run scenarios
        shell: bash
        run: macos-native/e2e/run.sh '${{ matrix.distro }}'
